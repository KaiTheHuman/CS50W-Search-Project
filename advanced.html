<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Advanced Search</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body class="abody">
        <div class="links">
            
            <a href="index.html">Regular Search</a>
            <a href="images.html"> Image Search</a>
        </div>
            <h1>Advanced Search </h1>
            <h2>Find pages with</h2>
            <form action="https://google.com/search">
                <div class="advanced">
                    <div>
                        <label>All of these words:</label>
                        <input class="aInput" type="text" name="as_q">
                    </div>
                    <div>
                        <label>This exact word or phrase:</label>
                        <input class="aInput" type="text" name="as_epq">
                    </div>
                    <div>
                        <label>Any of these words:</label>
                        <input class="aInput" type="text" name="as_oq">
                    </div>
                    <div>
                        <label>None of these words:</label>
                        <input class="aInput" type="text" name="as_eq">
                    </div>
                    <div>
                        <input class="aButton" type="submit" value="Advanced Search">
                    </div>
                </div>
            </form>
        
    </body>
